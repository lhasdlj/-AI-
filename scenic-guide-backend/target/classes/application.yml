server:
  port: 8080

spring:
  application:
    name: scenic-guide-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/scenic_guide?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: ScenicGuideHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 自动将下划线命名映射为驼峰命名
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 在控制台打印 SQL 语句，方便开发调试
  global-config:
    db-config:
      id-type: auto # 主键生成策略自增

logging:
  level:
    root: INFO
    com.scenic.guide.mapper: DEBUG # 打印 Mapper 层 SQL
